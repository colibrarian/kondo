<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KONDŌ — Opening Soon</title>
<meta name="description" content="KONDŌ — Golden Hall. Where the Dragon Dwells. Our page is opening soon.">
<meta name="robots" content="noindex, follow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --white:#ffffff;
  --ink:#111111;
  --ink-soft:#5c5c5c;
  --muted:#8a8a8a;
  --line:#e2e2e2;
  --display:'Cinzel Decorative', serif;
  --body:'EB Garamond', Georgia, serif;
  --ui:'Inter', -apple-system, sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--white); color:var(--ink); font-family:var(--body);
  text-align:center; padding:40px 24px; position:relative; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.kanji-watermark{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-family:var(--display); font-weight:700; font-size:min(70vw,640px); line-height:1;
  color:var(--ink); opacity:.045; user-select:none; pointer-events:none;
}
.logo{ width:96px; height:auto; margin-bottom:32px; position:relative; }
.eyebrow{
  font-family:var(--ui); font-size:.72rem; letter-spacing:.3em; text-transform:uppercase;
  color:var(--muted); margin-bottom:22px; position:relative;
}
h1{
  font-family:var(--display); font-weight:900; font-size:clamp(2.6rem,9vw,4.6rem);
  letter-spacing:.03em; line-height:1; position:relative;
}
.tagline{
  font-family:var(--body); font-style:normal; font-weight:400; font-size:clamp(1.05rem,2vw,1.3rem);
  color:var(--ink); margin-top:18px; position:relative;
}
.notice{
  font-family:var(--body); font-style:italic; font-size:1.05rem; color:var(--ink-soft);
  margin-top:34px; max-width:420px; line-height:1.6; position:relative;
}
.instagram{
  margin-top:40px; display:inline-flex; align-items:center; gap:9px;
  font-family:var(--ui); font-size:.78rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink); border:1px solid var(--line); padding:13px 26px; position:relative;
  transition:all .3s var(--ease); text-decoration:none;
}
.instagram:hover{ border-color:var(--ink); background:var(--ink); color:var(--white); }
.instagram svg{ width:16px; height:16px; }
footer{
  margin-top:56px; font-family:var(--ui); font-size:.68rem; letter-spacing:.08em;
  color:var(--muted); position:relative;
}
</style>
</head>
<body>

<div class="kanji-watermark" aria-hidden="true">金堂</div>

<img class="logo" src="https://ik.imagekit.io/colibrarian/Kondo/logo%20minimal.png?tr=w-300,q-80,f-auto" alt="KONDŌ">

<span class="eyebrow">Golden Hall</span>
<h1>KONDŌ</h1>
<p class="tagline">Where the Dragon Dwells</p>

<p class="notice">Our page is opening soon.</p>

<a class="instagram" href="https://www.instagram.com/kondo_est" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
  @kondo_est
</a>

<footer>&copy; <span id="year"></span> KONDŌ</footer>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
